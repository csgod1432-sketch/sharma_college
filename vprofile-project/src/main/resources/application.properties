#-----------------------------------------------------------------------
# application.properties
# vprofile project — AWS backend services configuration
# Replace each ${VARIABLE} with real values when deploying on AWS
#-----------------------------------------------------------------------

#==========================
# AWS RDS — MySQL Database
# Port: 3306
# Endpoint format: <db-identifier>.<xxxx>.<region>.rds.amazonaws.com
#==========================
jdbc.driverClassName=com.mysql.cj.jdbc.Driver
jdbc.url=jdbc:mysql://${RDS_ENDPOINT}:3306/${RDS_DBNAME}?useSSL=false&useUnicode=true&characterEncoding=UTF-8
jdbc.username=${RDS_USERNAME}
jdbc.password=${RDS_PASSWORD}

#==========================
# Hibernate settings
#==========================
hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
hibernate.show_sql=false
hibernate.hbm2ddl.auto=update

#==========================
# AWS ElastiCache — Memcached
# Port: 11211
# Endpoint format: <cluster-name>.<xxxx>.<region>.cache.amazonaws.com
#==========================
memcached.active.host=${ELASTICACHE_ENDPOINT}
memcached.active.port=11211
memcached.standBy.host=${ELASTICACHE_ENDPOINT}
memcached.standBy.port=11211

#==========================
# Amazon MQ — RabbitMQ
# Port: 5671 (TLS) / 5672 (plain)
# Endpoint format: b-<broker-id>.mq.<region>.amazonaws.com
#==========================
rabbitmq.address=${AMAZON_MQ_ENDPOINT}
rabbitmq.port=5671
rabbitmq.username=${AMAZON_MQ_USERNAME}
rabbitmq.password=${AMAZON_MQ_PASSWORD}
rabbitmq.vhost=/
rabbitmq.exchange=vprofileExchange
rabbitmq.routingKey=vprofileRoutingKey
rabbitmq.queue=vprofileQueue
